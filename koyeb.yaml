# Koyeb App Configuration
# Docs: https://www.koyeb.com/docs/reference/koyeb-yaml
name: marutiparts-backend
type: web
docker:
  dockerfile: Dockerfile
ports:
  - port: 8000
    path: /
routes:
  - path: /
    port: 8000
regions:
  - fra
scalings:
  - min: 1
    max: 1
instance_types:
  - type: free
health_checks:
  - tcp:
      port: 8000
